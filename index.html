<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LifeLog | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <h1>LifeLog</h1>
    <p>Welcome back</p>

    <form id="loginForm">
      <input type="email" id ="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button class="button1" type="submit">Login</button> <!-- Login button type changed so that control can be taken over by javascript -->
    </form>
    <!--to show error message on wrong credentials -->
    <p id="errorMsg"></p>

    <span>Don't have an account? <a href="register.html">Register</a></span>
  </div>
  <script src="script.js"></script>
</body>
</html>
